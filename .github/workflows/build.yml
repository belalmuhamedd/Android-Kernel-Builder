name: "Build kernels"

env:
  OUT_DIR: "out"

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: "Path to config JSON file"
        required: true
        default: "miatoll-ksu.json"
      enable_KernelSU:
        description: "Enable KernelSU"
        required: false
        default: false
        type: boolean
      enable_terminal:
         description: "Start terminal before build"
         type: boolean
         default: false
      set_custom_build_identity:
        description: Set custom BUILD_USERNAME and BUILD_HOSTNAME
        required: false
        default: false
        type: boolean

jobs:
  Set-repos:
    name: "🐂 Parse configuration file"
    runs-on: ubuntu-latest
    env:
      CONFIGURATION: ${{ github.event.inputs.config_file }}
    outputs:
      repos: ${{ steps.generate-matrix.outputs.repos }}
    steps:
      - name: "😄 Checkout"
        uses: actions/checkout@v4

      - name: "🔍 Check configuration file"
        run: |
          if [ ! -f "${{ env.CONFIGURATION }}" ]; then
            echo "❌ Configuration file ${{ env.CONFIGURATION }} not found!"
            exit 1
          fi
          
      - name: "😆 Generate Matrix"
        id: generate-matrix
        run: |
          echo "repos<<EOF" >> $GITHUB_OUTPUT
          cat ${{ env.CONFIGURATION }} >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  Build-Kernel:
    name: "🐎 Build kernel"
    runs-on: ubuntu-latest
    needs:
      - Set-repos
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        repos: ${{ fromJSON(needs.Set-repos.outputs.repos) }}
    env:
      kernelDir: ${{ matrix.repos.kernelSource.name }}_${{ matrix.repos.kernelSource.device }}

      kernelName: ${{ matrix.repos.kernelSource.name }}
      kernelRepo: ${{ matrix.repos.kernelSource.repo }}
      kernelBranch: ${{ matrix.repos.kernelSource.branch }}
      kernelDevice: ${{ matrix.repos.kernelSource.device }}

      DEFCONFIG_NAME: ${{ matrix.repos.kernelSource.defconfig || format('{0}_defconfig', matrix.repos.kernelSource.device) }}

      withKernelSU: ${{ matrix.repos.withKernelSU || inputs.enable_KernelSU }}
    steps:
      - name: "✨ Create working dir"
        run: mkdir -p $kernelDir

      - name: "⭐ Install prerequisites"
        run: |
          sudo apt update
          sudo apt install -y build-essential bc curl git zip ftp gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev lftp zstd wget libfl-dev python3 libarchive-tools checkinstall libncurses-dev libsqlite3-dev tk-dev libgdbm-dev libc6-dev libbz2-dev libffi-dev libreadline-dev libdb-dev

          # Build Python 2.7 from source
          cd /tmp
          wget https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar xzf Python-2.7.18.tgz
          cd Python-2.7.18
          
          ./configure --prefix=/usr/local/python2.7
          make -j$(nproc)
          sudo make install
          
          # Symlink to python2
          sudo ln -sf /usr/local/python2.7/bin/python2.7 /usr/bin/python2
          python2 --version

      - name: "🌟 Clone kernel source => (${{ env.kernelRepo }})"
        working-directory: ./${{ env.kernelDir }}
        run: |
          git clone --recursive --branch $kernelBranch $kernelRepo $kernelName --depth=1

      - name: "🩹 Fix miatoll device-tree base includes"
        if: ${{ env.kernelName == 'miatoll' && env.kernelDevice == 'miatoll' }}
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dts_dir = Path("arch/arm64/boot/dts/qcom")
          include = '#include "atoll-ab.dtsi"\n'
          for overlay_name in (
              "curtana-atoll-ab-idp-overlay.dts",
              "excalibur-atoll-ab-idp-overlay.dts",
              "gram-atoll-ab-idp-overlay.dts",
              "joyeuse-atoll-ab-idp-overlay.dts",
          ):
              overlay = dts_dir / overlay_name
              text = overlay.read_text()
              if include not in text:
                  text = text.replace('#include "cust-atoll.dtsi"\n', include + '#include "cust-atoll.dtsi"\n', 1)
                  overlay.write_text(text)
          PY

      - name: "💫 Get toolchains"
        working-directory: ./${{ env.kernelDir }}
        env:
          toolchains: "${{ toJSON(matrix.repos.toolchains) }}"
        run: |
          toolchains_num="$(echo $toolchains | jq 'length')"
          echo $toolchains_num
          for ((i=0;i<toolchains_num;i++)); do
            name=$(echo $toolchains | jq -r ".[$i].name")
            repo=$(echo $toolchains | jq -r ".[$i].repo")
            branch=$(echo $toolchains | jq -r ".[$i].branch")
            archive=$(echo $toolchains | jq -r ".[$i].archive // empty")
            if [ -n "$archive" ]; then
              mkdir -p "$name"
              curl -L --fail --retry 3 "$archive" -o "$name.tar.gz"
              tar -xzf "$name.tar.gz" -C "$name"
              rm -f "$name.tar.gz"
            else
              git clone --recursive --branch $branch $repo $name --depth=1
            fi
            echo "$(pwd)/$name/" >> $GITHUB_PATH
            echo "$(pwd)/$name/bin" >> $GITHUB_PATH
          done

          echo "PATH Variable: $PATH"

      - name: "😎 Set args"
        id: generate-args
        working-directory: ./${{ env.kernelDir }}
        env:
          params: "${{ toJSON(matrix.repos.params) }}"
          THREAD: $(nproc --all)
        run: |
          echo "PATH Variable: $PATH"
          ARCH=$(echo $params | jq -r ".ARCH")
          CROSS_COMPILE=$(echo $params | jq -r ".CROSS_COMPILE")
          CROSS_COMPILE_COMPAT=$(echo $params | jq -r ".CROSS_COMPILE_COMPAT")
          CROSS_COMPILE_ARM32=$(echo $params | jq -r ".CROSS_COMPILE_ARM32")
          CLANG_TRIPLE=$(echo $params | jq -r ".CLANG_TRIPLE")
          CC=$(echo $params | jq -r ".CC")
          HOSTCC=$(echo $params | jq -r ".HOSTCC")
          HOSTCXX=$(echo $params | jq -r ".HOSTCXX")
          HOSTCFLAGS=$(echo $params | jq -r ".HOSTCFLAGS")
          HOSTLDFLAGS=$(echo $params | jq -r ".HOSTLDFLAGS")
          AR=$(echo $params | jq -r ".AR")
          NM=$(echo $params | jq -r ".NM")
          OBJCOPY=$(echo $params | jq -r ".OBJCOPY")
          OBJDUMP=$(echo $params | jq -r ".OBJDUMP")
          STRIP=$(echo $params | jq -r ".STRIP")
          READELF=$(echo $params | jq -r ".READELF")
          OBJSIZE=$(echo $params | jq -r ".OBJSIZE")
          LD=$(echo $params | jq -r ".LD")
          LLVM=$(echo $params | jq -r ".LLVM")
          LLVM_IAS=$(echo $params | jq -r ".LLVM_IAS")

          echo "ARCH=$ARCH" >> $GITHUB_ENV

          args="-j$(nproc --all)"
          if [ -n "${{ env.OUT_DIR }}" ]; then
            mkdir -p $(pwd)/${{ env.OUT_DIR }}
            args="$args O=$(pwd)/${{ env.OUT_DIR }}"
          fi
          if [ -n "$ARCH" ]; then
            args="$args ARCH=$ARCH"
          fi
          if [ -n "$CROSS_COMPILE" ]; then
            args="$args CROSS_COMPILE=$CROSS_COMPILE"
          fi
          if [ -n "$CLANG_TRIPLE" ]; then
            args="$args CLANG_TRIPLE=$CLANG_TRIPLE"
          fi
          if [ -n "$CROSS_COMPILE_COMPAT" ]; then
            args="$args CROSS_COMPILE_ARM32=$CROSS_COMPILE_COMPAT"
          fi
          if [ -n "$AR" ]; then
            args="$args AR=$AR"
          fi
          if [ -n "$CC" ]; then
            args="$args CC=$CC"
          fi
          if [ -n "$HOSTCC" ] && [ "$HOSTCC" != "null" ]; then
            args="$args HOSTCC=$HOSTCC"
          fi
          if [ -n "$HOSTCXX" ] && [ "$HOSTCXX" != "null" ]; then
            args="$args HOSTCXX=$HOSTCXX"
          fi
          if [ -n "$HOSTCFLAGS" ] && [ "$HOSTCFLAGS" != "null" ]; then
            args="$args HOSTCFLAGS=$HOSTCFLAGS"
          fi
          if [ -n "$HOSTLDFLAGS" ] && [ "$HOSTLDFLAGS" != "null" ]; then
            args="$args HOSTLDFLAGS=$HOSTLDFLAGS"
          fi
          if [ -n "$AR" ] && [ "$AR" != "null" ]; then
            args="$args AR=$AR"
          fi
          if [ -n "$NM" ] && [ "$NM" != "null" ]; then
            args="$args NM=$NM"
          fi
          if [ -n "$OBJCOPY" ] && [ "$OBJCOPY" != "null" ]; then
            args="$args OBJCOPY=$OBJCOPY"
          fi
          if [ -n "$OBJDUMP" ] && [ "$OBJDUMP" != "null" ]; then
            args="$args OBJDUMP=$OBJDUMP"
          fi
          if [ -n "$STRIP" ] && [ "$STRIP" != "null" ]; then
            args="$args STRIP=$STRIP"
          fi
          if [ -n "$READELF" ] && [ "$READELF" != "null" ]; then
            args="$args READELF=$READELF"
          fi
          if [ -n "$OBJSIZE" ] && [ "$OBJSIZE" != "null" ]; then
            args="$args OBJSIZE=$OBJSIZE"
          fi
          if [ -n "$LD" ] && [ "$LD" != "null" ]; then
            requested_ld="$LD"
            LD=$(command -v "$requested_ld" || true)
            if [ -z "$LD" ]; then
              echo "Requested linker was not found: $requested_ld"
              exit 1
            fi
            args="$args LD=$LD"
          fi
          if [ -n "$LLVM" ] && [ "$LLVM" != "null" ]; then
            args="$args LLVM=$LLVM"
          fi
          if [ -n "$LLVM_IAS" ] && [ "$LLVM_IAS" != "null" ]; then
            args="$args LLVM_IAS=$LLVM_IAS"
          fi
          echo "args=$args" >> $GITHUB_OUTPUT
          echo "Build args: $args"

      - name: "✅ Validate defconfig"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
           DEFCONFIG_PATH="./arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"
               echo "Using defconfig: $DEFCONFIG_PATH"
             if [ ! -f "$DEFCONFIG_PATH" ]; then
                 echo "❌ Defconfig not found: $DEFCONFIG_PATH"
              exit 1
             fi
    
      - name: "😋 Update KernelSU"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        if: ${{ env.withKernelSU == 'true' }}
        run: |
          if [ -d "./KernelSU" ]; then
            rm -rf "./KernelSU"
          fi
          if [ -d "./drivers/kernelsu" ]; then
            rm -rf "./drivers/kernelsu"
          fi

          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -s master

          echo -e "\nCONFIG_KSU_TAMPER_SYSCALL_TABLE=y" >> ./arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

          cat ./arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

      - name: "👍 Make defconfig"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        run: |
          echo "PATH Variable: $PATH"
          make ${args} ${{ env.DEFCONFIG_NAME }}

      - name: "🎶 Build kernel"
        if: github.event.inputs.enable_terminal == 'false'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        run: |
          echo "PATH Variable: $PATH"
          echo "Build args: ${args}"
          ulimit -s unlimited
          echo "Argument limit: $(getconf ARG_MAX)"
          
          if [[ "${{ github.actor }}" == "TheGamerKing561" && "${{ inputs.set_custom_build_identity }}" == "true" ]]; then
            export KBUILD_BUILD_USER="thegamerking"
            export KBUILD_BUILD_HOST="github-runner"
            echo "Using custom build identity."
          fi
          make ${args}

      - name: Install SSH server
        if: github.event.inputs.enable_terminal == 'true'
        run: |
          sudo apt update
          sudo apt install -y openssh-server
          sudo service ssh start
          echo "runner:${{ secrets.userpassword }}" | sudo chpasswd
      - name: Install cloudflared
        if: github.event.inputs.enable_terminal == 'true'
        run: |
         wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
         sudo dpkg -i cloudflared-linux-amd64.deb
      - name: Start Cloudflare Quick Tunnel
        if: github.event.inputs.enable_terminal == 'true'
        run: |
          cloudflared tunnel --url ssh://localhost:22

      - name: "💛 Upload Image"
        uses: actions/upload-artifact@v4
        with:
          name: Image(${{ env.kernelDevice }}-${{ env.kernelName }}-${{ env.kernelBranch }})
          path: ./${{ env.kernelDir }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image
          if-no-files-found: ignore

      - name: "💙 Upload Image.gz"
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz(${{ env.kernelDevice }}-${{ env.kernelName }}-${{ env.kernelBranch }})
          path: ./${{ env.kernelDir }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz*
          if-no-files-found: ignore

      - name: "💜 Upload dtb"
        uses: actions/upload-artifact@v4
        with:
          name: dtb(${{ env.kernelDevice }}-${{ env.kernelName }}-${{ env.kernelBranch }})
          path: |
            ./${{ env.kernelDir }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtb*
            ./${{ env.kernelDir }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dts/**/*.dtb
          if-no-files-found: ignore

      - name: "❤️ Upload dtbo.img"
        uses: actions/upload-artifact@v4
        with:
          name: dtbo.img(${{ env.kernelDevice }}-${{ env.kernelName }}-${{ env.kernelBranch }})
          path: ./${{ env.kernelDir }}/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtbo.img
          if-no-files-found: ignore
